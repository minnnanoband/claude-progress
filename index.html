<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude進捗</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude進捗">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f1d1a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#22201c;--sub:#6e6a63;--line:#e6e0d6;--track:#ece6dc;
  --acc:#c96442;--acc2:#f3ddd3;--ask:#2f6fd6;--ask2:#dde8fb;--ok:#3b8a5a;--ok2:#dcefe3;--bad:#c2372f;--bad2:#f6dcda}
@media (prefers-color-scheme:dark){:root{--bg:#1f1d1a;--card:#2a2824;--ink:#f1ede6;--sub:#a59f95;--line:#3a3732;
  --track:#3a3732;--acc2:#4a3027;--ask:#7fa8f0;--ask2:#25344d;--ok:#6cc08d;--ok2:#22382b;--bad:#ef7d75;--bad2:#4a2725}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;overflow-wrap:anywhere}
header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
header h1{font-size:21px;margin:0;flex:1}
.meta{font-size:12px;color:var(--sub);margin:0 0 14px}
.meta.stale{color:var(--bad)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.askbtn{background:var(--ask);border-color:var(--ask);color:#fff;font-weight:600}
button:disabled{opacity:.5}
h2{font-size:13px;color:var(--sub);font-weight:600;margin:20px 2px 8px;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.q{border:2px solid var(--ask);}
.q .who{font-size:12px;color:var(--ask);font-weight:600}
.q .title{font-size:17px;font-weight:700;margin:2px 0 6px;color:var(--ask)}
.body{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--ink);margin:0 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.opts button{border-color:var(--ask);color:var(--ask);background:var(--ask2);font-weight:600}
textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.row textarea{flex:1;min-width:0}
.sent{font-size:13px;color:var(--ok);background:var(--ok2);border-radius:8px;padding:6px 10px;margin-top:8px;white-space:pre-wrap}
.job .top{display:flex;align-items:center;gap:8px}
.job .name{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.s-run{background:var(--acc2);color:var(--acc)}.s-ask{background:var(--ask2);color:var(--ask)}
.s-done{background:var(--ok2);color:var(--ok)}.s-fail{background:var(--bad2);color:var(--bad)}
.kind{font-size:12px;color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.prog .bar{flex:1;margin:0}
.pct{font-size:24px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;line-height:1}
.pct small{font-size:14px;font-weight:700;margin-left:1px}
.job.done .pct{color:var(--ok)}.job.fail .pct{color:var(--bad)}.pct.na{color:var(--sub)}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.s-done .bar i,.job.done .bar i{background:var(--ok)}
.step{font-size:14px}
.when{font-size:12px;color:var(--sub)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
details{margin-top:8px}
summary{font-size:13px;color:var(--sub);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
details[data-job]>summary{display:inline-flex;align-items:center;gap:2px;padding:7px 14px;border-radius:99px;
  border:1px solid var(--acc);background:var(--acc2);color:var(--acc);font-weight:600;-webkit-user-select:none;user-select:none}
details[data-job]>summary:active{transform:scale(.97)}
details[data-job][open]>summary{background:var(--acc);color:#fff}
.job.done details[data-job]>summary{border-color:var(--ok);background:var(--ok2);color:var(--ok)}
.job.done details[data-job][open]>summary{background:var(--ok);color:#fff}
.job.fail details[data-job]>summary{border-color:var(--bad);background:var(--bad2);color:var(--bad)}
.job.fail details[data-job][open]>summary{background:var(--bad);color:#fff}
ol.tl{list-style:none;margin:8px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line)}
ol.tl li{font-size:13px;margin:0 0 6px;position:relative}
ol.tl li::before{content:"";position:absolute;left:-17px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--line)}
ol.tl li:last-child::before{background:var(--acc)}
ol.tl .tlp{color:var(--acc);font-size:12px;font-variant-numeric:tabular-nums}
ol.tl time{color:var(--sub);margin-right:6px;font-variant-numeric:tabular-nums}
.msg{font-size:13px;background:var(--ask2);border-radius:8px;padding:6px 10px;margin-top:6px;white-space:pre-wrap}
.msg small{color:var(--sub)}
.hist .qq{font-weight:600;font-size:14px}
.hist .aa{font-size:14px;margin-top:4px;padding-left:10px;border-left:3px solid var(--ok);white-space:pre-wrap}
.hist .jt{font-size:12px;color:var(--sub)}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:18px}
.setup{max-width:560px;margin:40px auto}
.setup input{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
footer{margin-top:26px;font-size:12px;color:var(--sub);word-break:break-all}
footer a{color:var(--sub)}
.use .lim{margin-bottom:12px}.use .lim:last-of-type{margin-bottom:6px}
.use .lt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.use .lp{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.use .lp small{font-size:13px}
.use .bar{margin:5px 0 3px;height:9px}
.use .rs{font-size:12px;color:var(--sub)}
.use .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.use .stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.use .stats span{font-size:11px;color:var(--sub)}
.use .ft{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);margin-top:8px}
.use .ft a{color:var(--acc)}
.err{background:var(--bad2);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
const NTFY = "https://ntfy.sh";
const VER = "2026-11-05c";   // 更新のたびに変える（古いページは自動で読み込み直す）
let VCHK = 0;
async function checkVersion(){
  if (Date.now() - VCHK < 120000) return;
  VCHK = Date.now();
  try {
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"})).text();
    const m = t.match(/const VER = "([^"]+)"/);
    if (m && m[1] !== VER && !(document.activeElement && document.activeElement.tagName === "TEXTAREA")) {
      location.replace(location.pathname + "?v=" + m[1] + location.hash);
    }
  } catch(e) {}
}
let TOPIC = "";
try {
  const h = new URLSearchParams(location.hash.slice(1)).get("t");
  if (h) { localStorage.setItem("cp-topic", h); }
  TOPIC = h || localStorage.getItem("cp-topic") || "";
} catch (e) { TOPIC = new URLSearchParams(location.hash.slice(1)).get("t") || ""; }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let SNAP = ls.get("cp-snap", null);
let SENT = ls.get("cp-sent", {});   // 送った回答/指示 {key:{a,t}}
let ERR = "";
let drafts = {};                    // 入力途中のテキスト（再描画で消えないように）
let openJobs = new Set(ls.get("cp-open", []));
let USNAP = ls.get("cp-usnap", null);   // Claude使用量アプリのデータ
let ULAST = 0;

function ago(t){
  const s = Math.max(0, Date.now()/1000 - t);
  if (s < 60) return "たった今";
  if (s < 3600) return Math.floor(s/60) + "分前";
  if (s < 86400) return Math.floor(s/3600) + "時間前";
  return Math.floor(s/86400) + "日前";
}
function hm(t){ const d=new Date(t*1000); const p=n=>String(n).padStart(2,"0");
  const today = new Date().toDateString()===d.toDateString();
  return (today?"":(d.getMonth()+1)+"/"+d.getDate()+" ")+p(d.getHours())+":"+p(d.getMinutes()); }

async function decode(msg){
  if (!msg.startsWith("z:")) return JSON.parse(msg);
  const bin = Uint8Array.from(atob(msg.slice(2)), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

async function load(){
  try {
    const r = await fetch(`${NTFY}/${TOPIC}/json?poll=1&since=latest`, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const lines = (await r.text()).trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === "message");
    if (lines.length) {
      const s = await decode(lines[lines.length-1].message);
      if (!SNAP || s.ts >= SNAP.ts) { SNAP = s; ls.set("cp-snap", s); }
    }
    ERR = "";
    await loadUsage();
    checkVersion();
  } catch (e) { ERR = "読み込みに失敗しました（" + e.message + "）。前回のデータを表示しています。"; }
  render();
}

function utopic(){ return (SNAP && SNAP.u) || ls.get("cp-utopic", ""); }
async function loadUsage(force){
  const ut = utopic();
  if (!ut || (!force && Date.now() - ULAST < 60000)) return;
  ULAST = Date.now();
  ls.set("cp-utopic", ut);
  try {
    const r = await fetch(`${NTFY}/${ut}/json?poll=1&since=12h`, {cache:"no-store"});
    if (!r.ok) return;
    for (const ln of (await r.text()).trim().split("\n").filter(Boolean)) {
      try { const m = JSON.parse(ln); if (m.event !== "message") continue;
        const u = JSON.parse(m.message); if (!USNAP || u.t >= USNAP.t) USNAP = u; } catch(e) {}
    }
    if (USNAP) ls.set("cp-usnap", USNAP);
  } catch(e) {}
}
const fmtTok = n => n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+"M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+"K":String(n);
const ucol = p => p>=90?"var(--bad)":p>=70?"#d9902b":"var(--acc)";
function untilReset(iso){
  if (!iso) return "";
  const d = new Date(iso), ms = d - Date.now();
  if (ms <= 0) return "リセット済み";
  const h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4);
  const left = h>=24 ? `${Math.floor(h/24)}日${h%24}時間` : h ? `${h}時間${m}分` : `${m}分`;
  return `あと${left}でリセット（${hm(d.getTime()/1000)}）`;
}
function usageCard(){
  const u = USNAP; if (!u) return "";
  const NAMES = {session:"5時間枠", weekly_all:"週間（全モデル）", weekly_opus:"週間（Opus）", weekly_sonnet:"週間（Sonnet）", weekly_fable:"週間（Fable）"};
  let h = `<h2>📊 Claude使用量${u.plan?"（"+esc(String(u.plan).toUpperCase())+"）":""}</h2><div class="card use">`;
  const lims = u.lim || [];
  if (lims.length) for (const l of lims) {
    const p = Math.max(0, Math.min(100, Math.round(l.p ?? 0)));
    h += `<div class="lim"><div class="lt"><span>${NAMES[l.k] || esc(l.k)}</span><span class="lp" style="color:${ucol(p)}">${p}<small>%</small></span></div>
      <div class="bar"><i style="width:${p}%;background:${ucol(p)}"></i></div><div class="rs">${untilReset(l.r)}</div></div>`;
  } else if (u.err === "expired") h += `<div class="rs">PCのClaude Codeのログインが期限切れのため、利用枠の％を取得できませんでした（PCでClaude Codeを起動すると直ります）。</div>`;
  if (u.ex) h += `<div class="rs">追加利用（今月）：${esc(u.ex.u)} / ${esc(u.ex.m)} ${esc(u.ex.c)}</div>`;
  const d = u.tok && u.tok.days && u.tok.days[u.tok.days.length-1];
  if (d) h += `<div class="stats"><div><b>${d[5]}</b><span>今日の応答数</span></div>
      <div><b>${fmtTok(d[1]+d[2]+d[4])}</b><span>今日のトークン</span></div><div><b>${fmtTok(d[3])}</b><span>キャッシュ読込</span></div></div>`;
  const old = Date.now()/1000 - u.t > 30*60;
  h += `<div class="ft"><span style="${old?"color:var(--bad)":""}">PCで取得 ${hm(u.t)}（${ago(u.t)}）</span>
    <a href="https://minnnanoband.github.io/claude-usage/#t=${encodeURIComponent(utopic())}" target="_blank" rel="noopener">詳しく見る ›</a></div></div>`;
  return h;
}

async function send(payload, key, text){
  const r = await fetch(`${NTFY}/${TOPIC}-a`, {method:"POST", body: JSON.stringify(payload)});
  if (!r.ok) throw new Error("HTTP " + r.status);
  SENT[key] = (SENT[key] || []).concat([{a:text, t:Math.floor(Date.now()/1000)}]);
  ls.set("cp-sent", SENT);
  delete drafts[key];
}

async function answer(qid, text, btn){
  text = (text || "").trim();
  if (!text) return;
  if (btn) btn.disabled = true;
  try { await send({q:qid, a:text}, "q:"+qid, text); }
  catch(e){ alert("送信できませんでした: " + e.message); }
  render();
}
async function instruct(jid, btn){
  const text = (drafts["j:"+jid] || "").trim();
  if (!text) return;
  btn.disabled = true;
  try { await send({job:jid, a:text}, "j:"+jid, text); }
  catch(e){ alert("送信できませんでした: " + e.message); }
  render();
}

function qCard(q){
  const key = "q:"+q.id, sent = SENT[key];
  let h = `<div class="card q"><div class="who">❓ 確認待ち${q.jt?"・"+esc(q.jt):""}<span class="when"> ・${hm(q.ts)}</span></div>
    <div class="title">${esc(q.q)}</div>`;
  if (q.body && q.body !== q.q) h += `<div class="body">${esc(q.body)}</div>`;
  if (sent) {
    h += `<div class="sent">✓ 送信済み：${esc(sent[sent.length-1].a)}\nPCが受け取ると「回答済み」に移ります。</div>
      <details><summary>回答を送り直す</summary>`;
  }
  if (q.opts && q.opts.length) h += `<div class="opts">${q.opts.map((o,i)=>`<button data-opt="${esc(q.id)}" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  h += `<div class="row"><textarea rows="2" data-draft="${key}" placeholder="自由に回答・指示を書く">${esc(drafts[key]||"")}</textarea>
    <button class="askbtn" data-ans="${esc(q.id)}">送信</button></div>`;
  if (sent) h += `</details>`;
  return h + `</div>`;
}

function jobCard(j){
  const st = j.status, label = {run:"進行中", ask:"確認待ち", done:"完了", fail:"エラー"}[st] || st;
  const pct = st === "done" ? 100 : (j.pct ?? null);
  const key = "j:"+j.id;
  const myMsgs = (SENT[key] || []).filter(m => !(j.inbox||[]).some(x => x.a === m.a));
  let h = `<div class="card job ${st}"><div class="top"><span class="name">${esc(j.title)}</span>
      <span class="chip s-${st}">${label}</span></div>`;
  if (j.kind) h += `<div class="kind">${esc(j.kind)}</div>`;
  h += `<div class="prog"><div class="bar"><i style="width:${pct ?? 0}%"></i></div>`
     + (pct !== null ? `<span class="pct">${pct}<small>%</small></span>` : `<span class="pct na">--<small>%</small></span>`) + `</div>`;
  h += `<div class="step">${st==="run"?'<span class="pulse"></span>':""}${esc(j.step)}</div>`;
  if (j.note && (st==="done"||st==="fail")) h += `<div class="body" style="margin:6px 0 0;color:var(--sub)">${esc(j.note)}</div>`;
  h += `<div class="when">更新 ${ago(j.updated)}・開始 ${hm(j.started)}</div>`;
  h += `<details data-job="${esc(j.id)}" ${openJobs.has(j.id)?"open":""}><summary>経過${(st==="run"||st==="ask")?"・指示を送る":""}</summary><ol class="tl">`;
  for (const [t, s, sp] of (j.steps||[])) h += `<li><time>${hm(t)}</time>${esc(s)}${sp!=null?` <b class="tlp">${sp}%</b>`:""}</li>`;
  h += `</ol>`;
  for (const m of (j.inbox||[])) h += `<div class="msg">📩 ${esc(m.a)} <small>${hm(m.t)}・${m.read?"Claudeが確認済み":"PCが受信済み・未読"}</small></div>`;
  for (const m of myMsgs) h += `<div class="msg">📩 ${esc(m.a)} <small>${hm(m.t)}・送信済み</small></div>`;
  if (st === "run" || st === "ask") {
    h += `<div class="row"><textarea rows="2" data-draft="${key}" placeholder="この作業への指示（次の進捗報告のときにClaudeへ届きます）">${esc(drafts[key]||"")}</textarea>
      <button class="primary" data-ins="${esc(j.id)}">送る</button></div>`;
  }
  return h + `</details></div>`;
}

function render(){
  const app = $("#app");
  if (!TOPIC) {
    app.innerHTML = `<div class="setup card"><h1 style="font-size:20px;margin:0 0 8px">Claude進捗</h1>
      <p style="font-size:14px;color:var(--sub)">PCで <code>progress.py url</code> を実行して表示されるURLを開くか、トピック名を入力してください。</p>
      <input id="tp" placeholder="cp-xxxxxxxx" autocapitalize="off" autocomplete="off">
      <div style="margin-top:10px"><button class="primary" id="tpok">はじめる</button></div></div>`;
    $("#tpok").onclick = () => { const v=$("#tp").value.trim(); if(v){ try{localStorage.setItem("cp-topic",v)}catch(e){} TOPIC=v; load(); } };
    return;
  }
  // 入力中は描き直さない（キーボードが閉じるのを防ぐ）
  const ae = document.activeElement;
  if (ae && ae.tagName === "TEXTAREA" && ae.value) { pendingRender = true; return; }
  pendingRender = false;

  const s = SNAP || {jobs:[], qs:[], ts:0};
  // PCが回答を受け取ったら送信済みの控えを消す
  for (const q of s.qs) if (q.ans && SENT["q:"+q.id]) delete SENT["q:"+q.id];
  for (const j of s.jobs) if (SENT["j:"+j.id]) SENT["j:"+j.id] = SENT["j:"+j.id].filter(m => !(j.inbox||[]).some(x=>x.a===m.a));
  ls.set("cp-sent", SENT);

  const openQ = s.qs.filter(q => !q.ans).sort((a,b)=>b.ts-a.ts);
  const doneQ = s.qs.filter(q => q.ans).sort((a,b)=>(b.ans_ts||0)-(a.ans_ts||0));
  const active = s.jobs.filter(j => j.status==="run"||j.status==="ask");
  const finished = s.jobs.filter(j => !(j.status==="run"||j.status==="ask"));
  const old = s.ts && (Date.now()/1000 - s.ts > 13*3600);

  let h = `<header><h1>Claude進捗</h1><button id="rf" aria-label="更新">↻ 更新</button></header>
    <p class="meta ${old?"stale":""}">${s.ts?"PCからの最終更新 "+hm(s.ts)+"（"+ago(s.ts)+"）":"まだデータがありません"}${old?"・PCがオフの可能性があります":""}</p>`;
  if (ERR) h += `<div class="err">${esc(ERR)}</div>`;
  if (openQ.length) h += `<h2>❓ 確認待ち（${openQ.length}）</h2>` + openQ.map(qCard).join("");
  h += `<h2>進行中（${active.length}）</h2>` + (active.length ? active.map(jobCard).join("") : `<div class="card empty">いま進行中の作業はありません</div>`);
  h += usageCard();
  if (finished.length) h += `<h2>完了・停止</h2>` + finished.slice(0,15).map(jobCard).join("");
  if (doneQ.length) h += `<h2>確認のやりとり（回答済み）</h2>` + doneQ.map(q => `<div class="card hist">
      <div class="jt">${q.jt?esc(q.jt)+"・":""}${hm(q.ts)}</div><div class="qq">❓ ${esc(q.q)}</div>
      <div class="aa">${esc(q.ans)}<div class="when">${{app:"スマホから",mail:"メールで",pc:"PCで"}[q.src]||""}回答・${hm(q.ans_ts)}</div></div></div>`).join("");
  h += `<footer>20秒ごとに自動更新（使用量は1分ごと）。確認や完了をプッシュ通知で受け取るには、ntfyアプリでトピック <code>${esc(TOPIC)}-n</code> を購読してください
    （<a href="${NTFY}/${encodeURIComponent(TOPIC)}-n" target="_blank" rel="noopener">ブラウザで開く</a>）。<br>ページ版 ${VER}</footer>`;
  app.innerHTML = h;

  $("#rf").onclick = load;
  app.querySelectorAll("textarea[data-draft]").forEach(t => t.oninput = () => { drafts[t.dataset.draft] = t.value; });
  app.querySelectorAll("button[data-opt]").forEach(b => b.onclick = () => {
    const q = s.qs.find(x => x.id === b.dataset.opt); const o = q.opts[+b.dataset.i];
    if (confirm(`「${o}」で回答しますか？`)) answer(q.id, o, b);
  });
  app.querySelectorAll("button[data-ans]").forEach(b => b.onclick = () => answer(b.dataset.ans, drafts["q:"+b.dataset.ans], b));
  app.querySelectorAll("button[data-ins]").forEach(b => b.onclick = () => instruct(b.dataset.ins, b));
  app.querySelectorAll("details[data-job]").forEach(d => d.ontoggle = () => {
    d.open ? openJobs.add(d.dataset.job) : openJobs.delete(d.dataset.job); ls.set("cp-open", [...openJobs]);
  });
}
let pendingRender = false;
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 200));
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 20000);
setInterval(() => { if (!document.hidden && !pendingRender) render(); }, 60000);
render();
if (TOPIC) load();
</script>
</body>
</html>
